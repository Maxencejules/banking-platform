name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/account-serv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/eq-banking-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/eq-banking-web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t mj-banking-api backend/account-serv
          docker build -t mj-banking-web frontend/eq-banking-web

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} concurrency and API demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    defaults:
      run:
        working-directory: backend/account-serv
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: banking_test
          POSTGRES_USER: bank_test
          POSTGRES_PASSWORD: bank_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bank_test -d banking_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BANKING_POSTGRES_TESTS: 'true'
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking_test
      SPRING_DATASOURCE_USERNAME: bank_test
      SPRING_DATASOURCE_PASSWORD: bank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the full backend suite on PostgreSQL
        run: ./mvnw -B verify
      - name: Customer and administrator API demo on a fresh database
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U bank_test banking_demo
          SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/banking_demo \
          DATABASE_URL=jdbc:postgresql://localhost:5432/banking_demo \
          DATABASE_USERNAME=bank_test DATABASE_PASSWORD=bank_test \
          SPRING_PROFILES_ACTIVE=prod DEMO_DATA_ENABLED=true \
          JWT_SECRET=disposable-ci-demo-secret-0123456789abcdef \
          java -jar target/account-serv-0.0.1-SNAPSHOT.jar >target/demo-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat target/demo-api.log; exit 1; fi
            sleep 1
          done
          python ../../scripts/demo_api.py >target/api-demo.json
          cat target/api-demo.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.postgres }}-proof
          path: |
            backend/account-serv/target/surefire-reports/
            backend/account-serv/target/demo-api.log
            backend/account-serv/target/api-demo.json
