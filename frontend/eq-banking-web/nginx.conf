server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Note: add_header in a location replaces (does not extend) server-level headers,
    # so security headers are repeated in each location that sets its own.

    # API, docs and health are served by the Spring Boot container.
    location ~ ^/(api|v3/api-docs|swagger-ui|swagger-ui\.html|actuator/health) {
        proxy_pass http://api:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles can be cached forever.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
