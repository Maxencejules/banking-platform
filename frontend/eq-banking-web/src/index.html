<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MJ Banking</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MJ Banking — manage chequing and savings accounts, transfers and statements online.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='800' fill='%23fff' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved (or OS) theme before Angular boots to avoid a light/dark flash.
    (function () {
      try {
        var saved = localStorage.getItem('mjb.theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark-theme');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>MJ Banking requires JavaScript to run.</noscript>
</body>
</html>
