# Full stack: PostgreSQL + Spring Boot API + Angular UI served by nginx.
#   cp .env.example .env   # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8080/swagger-ui.html (when SWAGGER_UI_ENABLED=true)
name: mj-banking

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mjbank
      POSTGRES_USER: mjbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjbank -d mjbank"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend/account-serv
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/mjbank
      DATABASE_USERNAME: mjbank
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in .env}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend/eq-banking-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
