# Local development: in-memory H2 seeded with demo data.
spring.datasource.url=jdbc:h2:mem:mjbank;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only signing secret. Production must provide JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.demo-data.enabled=true
