spring.application.name=account-serv
server.port=${PORT:8081}
spring.profiles.default=dev

# Persistence: schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Errors
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
info.app.name=MJ Banking

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Security
app.security.jwt.issuer=mj-banking
app.security.jwt.ttl=1h
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.login-lock-duration=15m

# Banking products
app.banking.daily-withdrawal-limit=5000.00
app.banking.savings-interest-rate=2.50
app.banking.max-open-accounts=10
# Monthly interest run: 03:00 UTC on the 1st
app.banking.interest-cron=0 0 3 1 * *
