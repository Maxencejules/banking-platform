# Production: PostgreSQL, secrets from the environment. Startup fails if they are missing.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.h2.console.enabled=false

app.security.jwt.secret=${JWT_SECRET}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
server.forward-headers-strategy=framework
